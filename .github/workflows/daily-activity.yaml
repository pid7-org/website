name: GH Data Sync

on:
  schedule:
    # Runs at 18:30 UTC every Saturday (Sunday 00:00 IST)
    - cron: '30 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  collect-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize GitHub Dataset
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ORG: ${{ vars.GITHUB_ORG || 'pid7-org' }}
        run: pnpm run github:sync -- --incremental --days 7

      - name: Commit and push updated dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/gh-data.json

          if git diff --cached --quiet; then
            echo "No data updates to commit."
          else
            git commit -m "(gh-actions) data: update org gh-data dataset [skip ci]"
            git push
          fi

      - name: Trigger Cloudflare deployment
        run: |
          gh workflow run deploy-cloudflare.yaml --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
